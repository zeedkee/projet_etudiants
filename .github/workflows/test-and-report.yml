name: Tests & Report to Xray

on:
  push:
    branches: [version-4]
  pull_request:
    branches: [version-4, version-3]

jobs:
  # ========================
  # Job 1: Build and Test
  # ========================
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: etudiants_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run tests with Maven (unit + integration + JaCoCo)
        working-directory: ./api-spring-boot
        run: mvn verify -Dspring.datasource.url=jdbc:postgresql://localhost:5432/etudiants_db -Dspring.datasource.username=postgres -Dspring.datasource.password=postgres123 -Dspring.cache.type=none -Deureka.client.enabled=false
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: api-spring-boot/target/surefire-reports/

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: api-spring-boot/target/site/jacoco/

  # ========================
  # Job 2: Publish to Xray
  # ========================
  publish-to-xray:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: success()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Publish results to Xray
        run: |
          for file in test-results/TEST-*.xml; do
            if [ -f "$file" ]; then
              echo "Publishing $file to Xray..."
              curl -H "Content-Type: multipart/form-data" \
                   -H "Authorization: Bearer ${{ secrets.XRAY_TOKEN }}" \
                   -F "file=@$file" \
                   "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=GEST"
            fi
          done