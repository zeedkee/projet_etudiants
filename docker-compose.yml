version: "3.8"

services:
  # ========================
  # Service Base de données
  # ========================
  db:
    image: postgres:16-alpine
    container_name: postgres-etudiants
    environment:
      POSTGRES_DB: etudiants_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - etudiants-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ========================
  # Service Redis (Cache)
  # ========================
  redis:
    image: redis:7-alpine
    container_name: redis-etudiants
    ports:
      - "6379:6379"
    networks:
      - etudiants-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ========================
  # Service API Spring Boot
  # ========================
  api:
    build:
      context: ./api-spring-boot
      dockerfile: Dockerfile
    container_name: api-etudiants
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/etudiants_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CACHE_TYPE: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - etudiants-network
    restart: on-failure

# ========================
# Réseau partagé
# ========================
networks:
  etudiants-network:
    driver: bridge

# ========================
# Volumes persistants
# ========================
volumes:
  postgres_data: