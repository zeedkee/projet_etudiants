# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://db:5432/etudiants_db
spring.datasource.username=postgres
spring.datasource.password=postgres123

# JPA / Hibernate — update pour ne pas perdre les données existantes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Port du serveur
server.port=8080

# Redis Cache
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.cache.type=redis

# Let Spring throw exceptions for missing static resources instead of returning 404 silently
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true