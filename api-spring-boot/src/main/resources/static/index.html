<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Étudiants</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1a237e;
            margin-bottom: 30px;
            font-size: 2em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        thead {
            background-color: #3f51b5;
            color: white;
        }
        th {
            padding: 16px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            padding: 14px 20px;
            border-bottom: 1px solid #e0e0e0;
            color: #424242;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background-color: #e8eaf6;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #757575;
            font-size: 1.1em;
        }
        .error {
            text-align: center;
            padding: 40px;
            color: #d32f2f;
            font-size: 1.1em;
        }
        .badge {
            background-color: #e8eaf6;
            color: #3f51b5;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .refresh-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 30px;
            background-color: #3f51b5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
        }
        .refresh-btn:hover {
            background-color: #283593;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Liste des Étudiants</h1>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>CIN</th>
                    <th>Nom</th>
                    <th>Date de Naissance</th>
                    <th>Âge</th>
                </tr>
            </thead>
            <tbody id="etudiant-body">
                <tr>
                    <td colspan="5" class="loading">Chargement des étudiants...</td>
                </tr>
            </tbody>
        </table>

        <button class="refresh-btn" onclick="chargerEtudiants()">Rafraîchir</button>
    </div>

    <script>
        function chargerEtudiants() {
            const tbody = document.getElementById('etudiant-body');
            tbody.innerHTML = '<tr><td colspan="5" class="loading">Chargement...</td></tr>';

            fetch('/api/etudiants')
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('Erreur HTTP : ' + response.status);
                    }
                    return response.json();
                })
                .then(function(etudiants) {
                    tbody.innerHTML = '';

                    if (etudiants.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="loading">Aucun étudiant trouvé.</td></tr>';
                        return;
                    }

                    etudiants.forEach(function(etudiant, index) {
                        var tr = document.createElement('tr');
                        tr.innerHTML =
                            '<td>' + (index + 1) + '</td>' +
                            '<td><span class="badge">' + etudiant.cin + '</span></td>' +
                            '<td>' + etudiant.nom + '</td>' +
                            '<td>' + etudiant.dateNaissance + '</td>' +
                            '<td>' + (etudiant.age !== undefined ? etudiant.age + ' ans' : 'N/A') + '</td>';
                        tbody.appendChild(tr);
                    });
                })
                .catch(function(error) {
                    tbody.innerHTML = '<tr><td colspan="5" class="error">Erreur : ' + error.message + '</td></tr>';
                });
        }

        // Charger au démarrage de la page
        chargerEtudiants();
    </script>
</body>
</html>
